name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
      - name: Build installable APK
        run: |
          mkdir -p app/src/main/res/drawable-nodpi
          cp app/src/main/assets/icon.webp app/src/main/res/drawable-nodpi/radio_icon_exact.webp
          gradle --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk Radio_Cesky_Raj.apk
      - name: Validate APK signature and manifest
        run: |
          echo '----- APK filesize -----'
          stat -c '%n = %s bytes' Radio_Cesky_Raj.apk
          echo '----- Build tools -----'
          ls "$ANDROID_HOME/build-tools" || true
          TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$TOOLS/apksigner" verify --verbose --print-certs Radio_Cesky_Raj.apk
          "$TOOLS/aapt" dump badging Radio_Cesky_Raj.apk | head -n 18
          "$TOOLS/zipalign" -c -v 4 Radio_Cesky_Raj.apk
      - name: Install and launch APK in Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r Radio_Cesky_Raj.apk
            adb shell am start -n cz.radioceskyraj.mobile/cz.radioceskyraj.app.MainActivity
            sleep 3
            adb shell pidof cz.radioceskyraj.mobile
      - uses: actions/upload-artifact@v4
        with:
          name: Radio_Cesky_Raj_APK
          path: Radio_Cesky_Raj.apk
          retention-days: 30
