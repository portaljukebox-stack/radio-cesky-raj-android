name: RADIO CESKY RAJ 2.8.3 - iPhone IPA and Simulator (stream online/offline status test)
on:
  push:
    branches: [cool-visual-test]
    paths:
      - '.github/workflows/build-ios-simulator.yml'
      - 'tools/prepare_original_flutter.py'
      - 'tools/prepare_ios_project.py'
      - 'tools/templates/**'
      - 'assets/branding/rcr_premium_splash.webp'
      - 'app/src/main/assets/icon.webp'
      - 'rohozec_radio (2).zip'
  workflow_dispatch:
jobs:
  ios-simulator:
    name: Build and launch Rádio Český ráj on iPhone Simulator (macOS latest)
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Select available Xcode
        shell: bash
        run: |
          set -euo pipefail
          echo "Available Xcode installations:"
          ls -d /Applications/Xcode*.app 2>/dev/null || true
          xcodebuild -version
          xcode-select -p
          xcodebuild -showsdks

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.7.12'
          channel: stable
          cache: true

      - name: Prepare original Flutter app and iOS project
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/rcr-ios-python"
          "$RUNNER_TEMP/rcr-ios-python/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/rcr-ios-python/bin/python" -m pip install Pillow==12.0.0
          "$RUNNER_TEMP/rcr-ios-python/bin/python" tools/verify_logo.py
          "$RUNNER_TEMP/rcr-ios-python/bin/python" tools/prepare_original_flutter.py
          cd radio_cesky_raj
          flutter create --platforms=ios --org cz.radioceskyraj .
          cd ..
          "$RUNNER_TEMP/rcr-ios-python/bin/python" tools/prepare_ios_project.py

      - name: Resolve Flutter and CocoaPods dependencies
        working-directory: radio_cesky_raj
        run: |
          set -euo pipefail
          flutter doctor -v
          flutter pub get
          cd ios
          pod install
          cd ..

      - name: Build unsigned iOS Simulator application (debug; simulator does not support release)
        working-directory: radio_cesky_raj
        run: |
          set -euo pipefail
          flutter build ios --simulator --no-codesign --debug --build-name=2.8.3 --build-number=44
          test -d build/ios/iphonesimulator/Runner.app
          /usr/libexec/PlistBuddy -c 'Set :CFBundleShortVersionString 2.8.3' build/ios/iphonesimulator/Runner.app/Info.plist
          /usr/libexec/PlistBuddy -c 'Set :CFBundleVersion 44' build/ios/iphonesimulator/Runner.app/Info.plist
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' build/ios/iphonesimulator/Runner.app/Info.plist
          /usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' build/ios/iphonesimulator/Runner.app/Info.plist
          /usr/libexec/PlistBuddy -c 'Print :UIBackgroundModes' build/ios/iphonesimulator/Runner.app/Info.plist

      - name: Install and launch on an available iPhone simulator
        timeout-minutes: 4
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p result
          DEVICE_ID="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); a=[x for v in d["devices"].values() for x in v if x["isAvailable"] and x["name"].startswith("iPhone")]; print(a[0]["udid"] if a else "")')"
          if [ -z "$DEVICE_ID" ]; then
            echo "No available iPhone simulator was found"
            xcrun simctl list devices available
            exit 1
          fi
          echo "Using simulator $DEVICE_ID"
          xcrun simctl boot "$DEVICE_ID" 2>/dev/null || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcrun simctl install "$DEVICE_ID" radio_cesky_raj/build/ios/iphonesimulator/Runner.app
          xcrun simctl launch "$DEVICE_ID" cz.radioceskyraj.radio
          sleep 8
          xcrun simctl io "$DEVICE_ID" screenshot result/RCR_iOS_2_8_3_SIMULATOR.png
          test -s result/RCR_iOS_2_8_3_SIMULATOR.png
          echo "iOS SIMULATOR: app installed and launched"

      - name: Build unsigned iPhone device application (version 2.8.3)
        working-directory: radio_cesky_raj
        shell: bash
        run: |
          set -euo pipefail
          flutter build ios --no-codesign --release --build-name=2.8.3 --build-number=44
          test -d build/ios/iphoneos/Runner.app
          /usr/libexec/PlistBuddy -c 'Set :CFBundleShortVersionString 2.8.3' build/ios/iphoneos/Runner.app/Info.plist
          /usr/libexec/PlistBuddy -c 'Set :CFBundleVersion 44' build/ios/iphoneos/Runner.app/Info.plist
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' build/ios/iphoneos/Runner.app/Info.plist
          /usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' build/ios/iphoneos/Runner.app/Info.plist
          /usr/libexec/PlistBuddy -c 'Print :UIBackgroundModes' build/ios/iphoneos/Runner.app/Info.plist
          mkdir -p "$GITHUB_WORKSPACE/result/Payload"
          ditto build/ios/iphoneos/Runner.app "$GITHUB_WORKSPACE/result/Payload/Runner.app"
          cd "$GITHUB_WORKSPACE/result"
          /usr/bin/zip -qry RCR_iOS_2_8_3_UNSIGNED.ipa Payload
          test -s RCR_iOS_2_8_3_UNSIGNED.ipa

      - name: Package simulator preview
        shell: bash
        run: |
          set -euo pipefail
          ditto -c -k --sequesterRsrc --keepParent radio_cesky_raj/build/ios/iphonesimulator/Runner.app result/RCR_iOS_2_8_3_SIMULATOR_UNSIGNED.zip
          # Hash files only; result/Payload is a directory created for the IPA.
          find result -maxdepth 1 -type f -print0 | sort -z | xargs -0 shasum -a 256
          /usr/bin/unzip -t result/RCR_iOS_2_8_3_UNSIGNED.ipa
          test -d result/Payload/Runner.app
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' result/Payload/Runner.app/Info.plist
          /usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' result/Payload/Runner.app/Info.plist
          ls -lh result/*

      - uses: actions/upload-artifact@v4
        with:
          name: RCR_iOS_2_8_3_IPHONE_TEST
          path: |
            result/RCR_iOS_2_8_3_UNSIGNED.ipa
            result/RCR_iOS_2_8_3_SIMULATOR_UNSIGNED.zip
            result/RCR_iOS_2_8_3_SIMULATOR.png
          if-no-files-found: error
          retention-days: 30
