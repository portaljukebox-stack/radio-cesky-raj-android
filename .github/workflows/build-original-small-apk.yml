name: Mala originalni Android APK - Radio Cesky raj
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-original-small-apk.yml'
      - 'tools/prepare_original_flutter.py'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.7.12'
          channel: stable
          cache: true
      - name: Prepare same original Flutter application
        run: |
          python3 -m pip install --user Pillow==12.0.0
          python3 tools/prepare_original_flutter.py
          python3 - <<'PY'
          from pathlib import Path
          gradle=Path('radio_cesky_raj/android/app/build.gradle')
          text=gradle.read_text()
          old="if (keystorePropertiesFile.exists()) {\n                signingConfig signingConfigs.release\n            }"
          assert old in text, "Unexpected signing configuration"
          gradle.write_text(text.replace(old, "signingConfig signingConfigs.debug"))
          PY
      - name: Build smaller release APKs - identical original Flutter app
        working-directory: radio_cesky_raj
        run: |
          flutter pub get
          flutter build apk --release --split-per-abi --no-pub
      - name: Validate APKs, names and signing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p result
          cp radio_cesky_raj/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk result/Radio_Cesky_Raj_ARM64.apk
          cp radio_cesky_raj/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk result/Radio_Cesky_Raj_ARM32.apk
          cp radio_cesky_raj/build/app/outputs/flutter-apk/app-x86_64-release.apk result/Radio_Cesky_Raj_X86_64.apk
          TOOL=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n 1)
          for APK in result/*.apk; do
            echo "CHECK $APK"
            stat -c '%n %s bytes' "$APK"
            test "$(stat -c %s "$APK")" -gt 8000000
            "$TOOL" verify --verbose "$APK"
            "$AAPT" dump badging "$APK" | grep -E "^(package:|application-label:|native-code:)"
          done
          python3 - <<'PY'
          import re,subprocess,zipfile
          from PIL import Image,ImageChops,ImageStat
          from io import BytesIO
          from pathlib import Path
          apktools=sorted(Path("/usr/local/lib/android/sdk/build-tools").glob("*/aapt"))
          aapt=str(apktools[-1])
          expected=Image.open("radio_cesky_raj/assets/appicon/appicon.png").convert("RGB")
          for apk in Path("result").glob("*.apk"):
              badging=subprocess.check_output([aapt,"dump","badging",str(apk)],text=True)
              assert "cz.radioceskyraj.flutter2026" in badging, "Unexpected package id"
              assert "Rádio Český ráj" in badging, "Wrong app title"
              icons=re.findall(r"application-icon-\d+:'([^']+)'",badging)
              assert icons, "Launcher icons missing"
              with zipfile.ZipFile(apk) as z:
                  actual=Image.open(BytesIO(z.read(icons[-1]))).convert("RGB")
              ref=expected.resize(actual.size,Image.Resampling.LANCZOS)
              err=sum(ImageStat.Stat(ImageChops.difference(ref,actual)).mean)/3
              print(apk.name, "launcher pixel difference", round(err,2))
              assert err < 40, "Android icon is not RCR branding"
          PY
          sha256sum result/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: RCR_Originalni_Aplikace_ARM64
          path: result/Radio_Cesky_Raj_ARM64.apk
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: RCR_Originalni_Aplikace_ARM32
          path: result/Radio_Cesky_Raj_ARM32.apk
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: RCR_Originalni_Aplikace_X86_64
          path: result/Radio_Cesky_Raj_X86_64.apk
          if-no-files-found: error
          retention-days: 30
