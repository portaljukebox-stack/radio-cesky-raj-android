name: RADIO CESKY RAJ 2.8.1 - stable signed build
on:
  push:
    branches: [cool-visual-test]
    paths:
      - 'tools/prepare_original_flutter.py'
      - 'tools/templates/**'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.7.12'
          channel: stable
          cache: true
      - name: Prepare same original Flutter application
        run: |
          python3 -m pip install --user Pillow==12.0.0
          python3 tools/verify_logo.py
          python3 tools/prepare_original_flutter.py
          AAPT2=$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name aapt2 -type f | sort -V | tail -1)
          test -x "$AAPT2"
          echo "New Android Asset Packaging Tool: $AAPT2"
          echo "android.aapt2FromMavenOverride=$AAPT2" >> radio_cesky_raj/android/gradle.properties
      - name: Configure persistent release signing
        env:
          RCR_RELEASE_KEYSTORE_BASE64: ${{ secrets.RCR_RELEASE_KEYSTORE_BASE64 }}
          RCR_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RCR_RELEASE_KEYSTORE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${RCR_RELEASE_KEYSTORE_BASE64:-}" || -z "${RCR_RELEASE_KEYSTORE_PASSWORD:-}" ]]; then
            echo "Missing GitHub Actions secrets: RCR_RELEASE_KEYSTORE_BASE64 and/or RCR_RELEASE_KEYSTORE_PASSWORD"
            exit 1
          fi
          printf '%s' "$RCR_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/rcr-release.jks"
          test -s "$RUNNER_TEMP/rcr-release.jks"
          keytool -list -keystore "$RUNNER_TEMP/rcr-release.jks" -storepass "$RCR_RELEASE_KEYSTORE_PASSWORD" -alias rcr-release >/dev/null
          cat > radio_cesky_raj/android/key.properties <<EOF
          storePassword=$RCR_RELEASE_KEYSTORE_PASSWORD
          keyPassword=$RCR_RELEASE_KEYSTORE_PASSWORD
          keyAlias=rcr-release
          storeFile=$RUNNER_TEMP/rcr-release.jks
          EOF
          chmod 600 radio_cesky_raj/android/key.properties "$RUNNER_TEMP/rcr-release.jks"
          echo "Persistent Rádio Český ráj release signing key loaded."

      - name: Build smaller release APKs - identical original Flutter app
        working-directory: radio_cesky_raj
        run: |
          flutter pub get
          python3 - <<'PY'
          from pathlib import Path
          cache=Path.home()/'.pub-cache/hosted/pub.dev/radio_player-1.2.1/android/build.gradle'
          gradle=cache.read_text()
          assert gradle.count('com.google.android.exoplayer:') == 2, "Radio player dependency layout changed"
          assert gradle.count('2.17.1') == 2, "Original ExoPlayer version changed"
          cache.write_text(gradle.replace('2.17.1','2.19.1'))
          print("Upgraded legacy ExoPlayer from 2.17.1 to 2.19.1 to support Android14+ receivers")
          PY
          flutter build apk --release --split-per-abi --no-pub
      - name: Validate APKs, names and signing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p result
          cp radio_cesky_raj/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk result/Radio_Cesky_Raj_2_8_1_ARM64.apk
          cp radio_cesky_raj/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk result/Radio_Cesky_Raj_2_8_1_ARM32.apk
          cp radio_cesky_raj/build/app/outputs/flutter-apk/app-x86_64-release.apk result/Radio_Cesky_Raj_2_8_1_X86_64.apk
          TOOL=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n 1)
          for APK in result/*.apk; do
            echo "CHECK $APK"
            stat -c '%n %s bytes' "$APK"
            test "$(stat -c %s "$APK")" -gt 8000000
            "$TOOL" verify --verbose "$APK"
            BADGING=$("$AAPT" dump badging "$APK")
            echo "$BADGING" | grep -E "^(package:|application-label:|native-code:)"
            echo "$BADGING" | grep -F "package: name='cz.radioceskyraj.radio' versionCode='42' versionName='2.8.1'"
          done
          python3 - <<'PY'
          import zipfile
          from PIL import Image,ImageChops,ImageStat
          from io import BytesIO
          from pathlib import Path
          actual_logo=Image.open("radio_cesky_raj/assets/appicon/appicon.png").convert("RGB")
          orig_zip=zipfile.ZipFile("rohozec_radio (2).zip")
          old_icons=[n for n in orig_zip.namelist() if n.endswith("/res/mipmap-xxxhdpi/ic_launcher.png")]
          assert old_icons, "Cannot locate the old Rohozec icon for comparison"
          old_logo=Image.open(BytesIO(orig_zip.read(old_icons[0]))).convert("RGB")
          def difference(ref,im):
              return sum(ImageStat.Stat(ImageChops.difference(
                  ref.resize(im.size,Image.Resampling.LANCZOS),im)).mean)/3
          for apk in Path("result").glob("*.apk"):
              found_rcr=[]
              found_old=[]
              with zipfile.ZipFile(apk) as z:
                  for name in z.namelist():
                      if not name.startswith("res/") or not name.lower().endswith(".png"):
                          continue
                      try:
                          im=Image.open(BytesIO(z.read(name))).convert("RGB")
                          if min(im.size)<48 or max(im.size)>1024: continue
                          good=difference(actual_logo,im)
                          bad=difference(old_logo,im)
                          if good<35: found_rcr.append((round(good,1),name))
                          if bad<20: found_old.append((round(bad,1),name))
                      except Exception: pass
              print(apk.name,"RCR resources",found_rcr[:10],"OLD ROHOZEC resources",found_old[:10])
              assert found_rcr, "RCR logo absent from native Android compiled image resources"
              assert not found_old, "Legacy Rohozec app icon is still present in APK"
          PY
          python3 - <<'PY'
          from pathlib import Path
          import zipfile,hashlib,subprocess
          full=Path("radio_cesky_raj/assets/images/rcr_full_logo.png").read_bytes()
          logo_hash=hashlib.sha256(full).hexdigest()
          aapt=str(sorted(Path("/usr/local/lib/android/sdk/build-tools").glob("*/aapt"))[-1])
          for apk in Path("result").glob("*.apk"):
              with zipfile.ZipFile(apk) as z:
                  names=[name for name in z.namelist() if name.endswith("assets/images/rcr_full_logo.png")]
                  assert names, "STOP: Complete station logo missing from Flutter APK"
                  assert hashlib.sha256(z.read(names[0])).hexdigest()==logo_hash, "Logo mismatch in APK"
              out=subprocess.check_output([aapt,"dump","badging",str(apk)],text=True)
              assert "targetSdkVersion:'35'" in out, "APK is still targeting obsolete Android"
              print(apk.name,"Complete station logo included, Android target SDK 35 confirmed")
          PY
          sha256sum result/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: RCR_2_8_1_ARM64
          path: result/Radio_Cesky_Raj_PREMIUM_2_8_ARM64.apk
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: RCR_2_8_1_ARM32
          path: result/Radio_Cesky_Raj_PREMIUM_2_8_ARM32.apk
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: RCR_2_8_1_X86_64
          path: result/Radio_Cesky_Raj_PREMIUM_2_8_X86_64.apk
          if-no-files-found: error
          retention-days: 30
