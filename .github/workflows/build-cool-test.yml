name: RADIO CESKY RAJ 2.8.3 PREMIUM SPLASH TEST - temporary signing
on:
  push:
    branches: [cool-visual-test]
    paths:
      - '.github/workflows/build-cool-test.yml'
      - 'tools/prepare_original_flutter.py'
      - 'tools/templates/**'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.7.12'
          channel: stable
          cache: true
      - name: Prepare same original Flutter application
        run: |
          python3 -m pip install --user Pillow==12.0.0
          python3 tools/verify_logo.py
          python3 tools/prepare_original_flutter.py
          AAPT2=$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name aapt2 -type f | sort -V | tail -1)
          test -x "$AAPT2"
          echo "New Android Asset Packaging Tool: $AAPT2"
          echo "android.aapt2FromMavenOverride=$AAPT2" >> radio_cesky_raj/android/gradle.properties
          python3 - <<'PY'
          from pathlib import Path
          import re
          gradle=Path('radio_cesky_raj/android/app/build.gradle')
          source=gradle.read_text(encoding='utf-8')
          source,n=re.subn(
              r'if \(keystorePropertiesFile\.exists\(\)\) \{\s*signingConfig signingConfigs\.release\s*\}',
              'signingConfig signingConfigs.debug', source
          )
          if n != 1:
              raise SystemExit('STOP: Release signing configuration has changed')
          gradle.write_text(source,encoding='utf-8')
          print('TEST ONLY: release APK uses temporary Android debug signing, NOT the final release key')
          PY
      - name: Build smaller release APKs - identical original Flutter app
        working-directory: radio_cesky_raj
        run: |
          flutter pub get
          python3 - <<'PY'
          from pathlib import Path
          root=Path.home()/'.pub-cache/hosted/pub.dev/radio_player-1.2.1/android/src/main'
          service=root/'kotlin/com/cheebeez/radio_player/RadioPlayerService.kt'
          if not service.is_file():
              raise SystemExit('STOP: exact pinned RadioPlayerService.kt not found')
          source=service.read_text(encoding='utf-8')
          dangerous='android.os.Process.killProcess(android.os.Process.myPid());'
          if source.count(dangerous) != 1:
              raise SystemExit('STOP: expected exactly one unsafe process-kill call in RadioPlayerService.onDestroy')
          source=source.replace(
              dangerous,
              '// RCR FIX: a service must never terminate the entire Android application process.'
          )
          service.write_text(source,encoding='utf-8')
          assert 'killProcess' not in source and 'myPid()' not in source
          print('FIX APPLIED: removed process-wide SIGKILL from RadioPlayerService.onDestroy')
          print('=== FULL RADIO_PLAYER 1.2.1 SERVICE SOURCE ===')
          print(source)
          print('=== END RADIO_PLAYER SERVICE SOURCE ===')
          PY
          python3 - <<'PY'
          from pathlib import Path
          root=Path.home()/'.pub-cache/hosted/pub.dev/radio_player-1.2.1/android/src/main'
          print('=== PINNED RADIO_PLAYER 1.2.1 ANDROID SOURCE DIAGNOSTIC ===')
          if not root.is_dir():
              raise SystemExit('STOP: radio_player 1.2.1 Android source not found in pub cache')
          for source in sorted(root.rglob('*.kt')) + sorted(root.rglob('*.java')):
              lines=source.read_text(encoding='utf-8',errors='replace').splitlines()
              hits=[i for i,line in enumerate(lines) if any(k in line for k in
                    ('killProcess','myPid','onDestroy','stopSelf','releasePlayer','Process.'))]
              if hits:
                  print('\\n---',source.relative_to(root),'---')
                  shown=set()
                  for i in hits:
                      for n in range(max(0,i-5),min(len(lines),i+9)):
                          if n not in shown:
                              print(f'{n+1}: {lines[n]}')
                              shown.add(n)
          print('=== END RADIO_PLAYER DIAGNOSTIC ===')
          PY
          python3 - <<'PY'
          from pathlib import Path
          cache=Path.home()/'.pub-cache/hosted/pub.dev/radio_player-1.2.1/android/build.gradle'
          gradle=cache.read_text()
          assert gradle.count('com.google.android.exoplayer:') == 2, "Radio player dependency layout changed"
          assert gradle.count('2.17.1') == 2, "Original ExoPlayer version changed"
          cache.write_text(gradle.replace('2.17.1','2.19.1'))
          print("Upgraded legacy ExoPlayer from 2.17.1 to 2.19.1 to support Android14+ receivers")
          PY
          flutter build apk --release --split-per-abi --no-pub
      - name: Validate APKs, names and signing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p result
          cp radio_cesky_raj/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk result/Radio_Cesky_Raj_2_8_3_ARM64.apk
          cp radio_cesky_raj/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk result/Radio_Cesky_Raj_2_8_3_ARM32.apk
          cp radio_cesky_raj/build/app/outputs/flutter-apk/app-x86_64-release.apk result/Radio_Cesky_Raj_2_8_3_X86_64.apk
          TOOL=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n 1)
          for APK in result/*.apk; do
            echo "CHECK $APK"
            stat -c '%n %s bytes' "$APK"
            test "$(stat -c %s "$APK")" -gt 8000000
            "$TOOL" verify --verbose "$APK"
            BADGING=$("$AAPT" dump badging "$APK")
            echo "$BADGING" | grep -E "^(package:|application-label:|native-code:)"
            echo "$BADGING" | grep -F "package: name='cz.radioceskyraj.radio'"
            echo "$BADGING" | grep -F "versionName='2.8.3'"
            echo "$BADGING" | grep -E "versionCode='(1044|2044|4044)'"
            echo "$BADGING" | grep -F "targetSdkVersion:'35'"
          done
          python3 - <<'PY'
          import zipfile
          from PIL import Image,ImageChops,ImageStat
          from io import BytesIO
          from pathlib import Path
          actual_logo=Image.open("radio_cesky_raj/assets/appicon/appicon.png").convert("RGB")
          orig_zip=zipfile.ZipFile("rohozec_radio (2).zip")
          old_icons=[n for n in orig_zip.namelist() if n.endswith("/res/mipmap-xxxhdpi/ic_launcher.png")]
          assert old_icons, "Cannot locate the old Rohozec icon for comparison"
          old_logo=Image.open(BytesIO(orig_zip.read(old_icons[0]))).convert("RGB")
          def difference(ref,im):
              return sum(ImageStat.Stat(ImageChops.difference(
                  ref.resize(im.size,Image.Resampling.LANCZOS),im)).mean)/3
          for apk in Path("result").glob("*.apk"):
              found_rcr=[]
              found_old=[]
              with zipfile.ZipFile(apk) as z:
                  for name in z.namelist():
                      if not name.startswith("res/") or not name.lower().endswith(".png"):
                          continue
                      try:
                          im=Image.open(BytesIO(z.read(name))).convert("RGB")
                          if min(im.size)<48 or max(im.size)>1024: continue
                          good=difference(actual_logo,im)
                          bad=difference(old_logo,im)
                          if good<35: found_rcr.append((round(good,1),name))
                          if bad<20: found_old.append((round(bad,1),name))
                      except Exception: pass
              print(apk.name,"RCR resources",found_rcr[:10],"OLD ROHOZEC resources",found_old[:10])
              assert found_rcr, "RCR logo absent from native Android compiled image resources"
              assert not found_old, "Legacy Rohozec app icon is still present in APK"
          PY
          python3 - <<'PY'
          from pathlib import Path
          import zipfile,hashlib,subprocess
          full=Path("radio_cesky_raj/assets/images/rcr_full_logo.png").read_bytes()
          logo_hash=hashlib.sha256(full).hexdigest()
          aapt=str(sorted(Path("/usr/local/lib/android/sdk/build-tools").glob("*/aapt"))[-1])
          for apk in Path("result").glob("*.apk"):
              with zipfile.ZipFile(apk) as z:
                  names=[name for name in z.namelist() if name.endswith("assets/images/rcr_full_logo.png")]
                  assert names, "STOP: Complete station logo missing from Flutter APK"
                  assert hashlib.sha256(z.read(names[0])).hexdigest()==logo_hash, "Logo mismatch in APK"
              out=subprocess.check_output([aapt,"dump","badging",str(apk)],text=True)
              assert "targetSdkVersion:'35'" in out, "APK is still targeting obsolete Android"
              print(apk.name,"Complete station logo included, Android target SDK 35 confirmed")
          PY
          sha256sum result/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: RCR_TEST_2_8_3_ARM64
          path: result/Radio_Cesky_Raj_2_8_3_ARM64.apk
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: RCR_TEST_2_8_3_ARM32
          path: result/Radio_Cesky_Raj_2_8_3_ARM32.apk
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: RCR_TEST_2_8_3_X86_64
          path: result/Radio_Cesky_Raj_2_8_3_X86_64.apk
          if-no-files-found: error
          retention-days: 30

  android16:
    name: Android 16 emulator smoke test (best effort)
    needs: build
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: RCR_TEST_2_8_3_X86_64
          path: apk
      - name: Enable hardware acceleration for Android emulator
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod a+rw /dev/kvm
            ls -l /dev/kvm
          else
            echo "::warning::KVM device unavailable on this runner"
          fi
      - name: Test actual installation, startup and screenshot on Android 16
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: default
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          heap-size: 1024M
          disable-animations: true
          script: |
            set -eu
            test -s apk/Radio_Cesky_Raj_2_8_3_X86_64.apk
            adb install -r apk/Radio_Cesky_Raj_2_8_3_X86_64.apk
            adb logcat -c
            mkdir -p screenshots
            adb shell am start -W -n cz.radioceskyraj.radio/com.cheebeez.single_radio.MainActivity
            sleep 12
            adb shell pidof cz.radioceskyraj.radio > screenshots/app_pid.txt || true
            adb shell ps -A > screenshots/processes.txt
            adb shell dumpsys activity activities > screenshots/activities.txt
            adb shell dumpsys window windows > screenshots/windows.txt
            adb logcat -d -v threadtime > screenshots/logcat.txt
            adb exec-out screencap -p > screenshots/RCR_2_8_3_ANDROID16.png
            adb shell dumpsys meminfo cz.radioceskyraj.radio > screenshots/app_meminfo.txt || true
            echo '=== APP PROCESS ==='
            cat screenshots/app_pid.txt
            grep -E 'cz.radioceskyraj.radio|radio_player' screenshots/processes.txt || true
            echo '=== APP ACTIVITY ==='
            grep -E 'mResumedActivity|topResumedActivity|ResumedActivity|cz.radioceskyraj.radio' screenshots/activities.txt | tail -30 || true
            echo '=== APP EXIT / CRASH DIAGNOSTICS ==='
            grep -Ei 'FATAL EXCEPTION|Process .* has died|Force finishing|Fatal signal|SIGKILL|SIG 9|killProcess|ExoPlayerImpl: Release|radio_player|AndroidRuntime' screenshots/logcat.txt | tail -100 || true
            python3 - <<'PY'
            from pathlib import Path
            import re
            pid=Path('screenshots/app_pid.txt').read_text().strip()
            activities=Path('screenshots/activities.txt').read_text(errors='replace')
            log=Path('screenshots/logcat.txt').read_text(errors='replace')
            if not pid:
                raise SystemExit('FAIL: application process is not running after 12 seconds')
            if not re.search(r'(?:mResumedActivity|topResumedActivity|ResumedActivity).*cz\\.radioceskyraj\\.radio', activities):
                raise SystemExit('FAIL: Rádio Český ráj is not the resumed foreground activity')
            if 'FATAL EXCEPTION' in log:
                raise SystemExit('FAIL: Android runtime fatal exception detected')
            if re.search(r'ActivityManager: Process cz\\.radioceskyraj\\.radio .* has died', log):
                raise SystemExit('FAIL: Rádio Český ráj process died during startup')
            print('ANDROID 16 PASS: app process',pid,'is alive and MainActivity remains in foreground')
            PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RCR_TEST_2_8_3_ANDROID16_SCREENSHOT
          path: screenshots/
          if-no-files-found: ignore
          retention-days: 14
