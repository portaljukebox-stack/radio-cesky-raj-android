name: Screenshot PREMIUM 2.7 on Android 16
on:
  push:
    branches: [cool-visual-test]
    paths:
      - '.github/workflows/premium-2-7-screenshot.yml'
  workflow_dispatch:
jobs:
  screenshot:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
    steps:
      - name: Download the validated PREMIUM 2.7 APK
        uses: actions/download-artifact@v4
        with:
          name: RCR_PREMIUM_2_7_X86_64
          run-id: 43046768459
          github-token: \${{ secrets.GITHUB_TOKEN }}
          path: apk
      - name: Install and capture on Android 16
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            set -eu
            mkdir -p screenshots
            adb wait-for-device
            BOOT=0
            for attempt in $(seq 1 90); do
              BOOT=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)
              if [ "$BOOT" = "1" ]; then break; fi
              sleep 2
            done
            test "$BOOT" = "1"
            adb install -r apk/Radio_Cesky_Raj_PREMIUM_2_7_X86_64.apk
            adb logcat -c
            adb shell am force-stop cz.radioceskyraj.premium27 || true
            adb shell am start -W -n cz.radioceskyraj.premium27/com.cheebeez.single_radio.MainActivity > screenshots/launch.txt
            sleep 10
            adb shell pidof cz.radioceskyraj.premium27 > screenshots/process.txt
            adb shell dumpsys window | grep -E 'mCurrentFocus|mFocusedApp' | tail -3 > screenshots/focus.txt || true
            CAPTURED=0
            for attempt in 1 2 3; do
              if adb exec-out screencap -p > screenshots/RCR_PREMIUM_2_7_ANDROID16.png && test -s screenshots/RCR_PREMIUM_2_7_ANDROID16.png; then
                CAPTURED=1
                break
              fi
              adb reconnect device || true
              adb wait-for-device || true
              sleep 3
            done
            test "$CAPTURED" = "1"
            adb logcat -d > screenshots/logcat.txt
            if grep -q 'FATAL EXCEPTION' screenshots/logcat.txt; then
              grep -B 3 -A 15 'FATAL EXCEPTION' screenshots/logcat.txt | tail -100
              exit 1
            fi
            python3 - <<'PY'
            from pathlib import Path
            import struct
            p=Path('screenshots/RCR_PREMIUM_2_7_ANDROID16.png')
            data=p.read_bytes()
            assert data[:8] == b'\x89PNG\r\n\x1a\n', 'Screenshot is not a PNG'
            width,height=struct.unpack('>II',data[16:24])
            print('Android 16 screenshot:', width, 'x', height, 'bytes:', len(data))
            assert width >= 300 and height >= 600
            PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RCR_PREMIUM_2_7_ANDROID16_SCREENSHOT
          path: screenshots/
          retention-days: 14
